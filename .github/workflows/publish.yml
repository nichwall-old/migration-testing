name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  ORIGINAL_IMAGE_NAME: ghcr.io/nichwall/migration-testing

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ORIGINAL_IMAGE_NAME }}:latest
            ${{ env.ORIGINAL_IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=publish-container
            type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: |
            type=gha,scope=publish-container,mode=max,ignore-error=true
            type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
